<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Нежная игра три в ряд: собирайте печенья и кексы, меняя соседние угощения местами." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./src/style.css" />
    <title>Угощения — три в ряд</title>
  </head>
  <body>
    <main aria-label="Угощения — игра три в ряд">
      <p id="instructions" class="sr-only">Выберите два соседних угощения или перетащите одно на соседнее. Соберите три или четыре одинаковых по горизонтали или вертикали. Стрелки перемещают фокус, Enter выбирает угощение, Escape отменяет выбор.</p>
      <div id="board" class="board" role="group" aria-label="Игровое поле: четыре ряда и четыре столбца" aria-describedby="instructions" aria-busy="true">
        <svg class="grid-lines" viewBox="0 0 400 400" fill="none" aria-hidden="true">
          <rect x="1" y="1" width="398" height="398" rx="20" />
          <path d="M100 1V399 M200 1V399 M300 1V399 M1 100H399 M1 200H399 M1 300H399" />
        </svg>
        <div id="pieces" class="pieces"><!-- INITIAL_BOARD --></div>
      </div>
      <p id="status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
    </main>
    <noscript><p class="load-error">Для игры откройте публичную ссылку в Safari или другом браузере с включённым JavaScript. Просмотр HTML-вложения не поддерживает игру.</p></noscript>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
